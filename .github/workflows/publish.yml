name: publish

# On a version bump merged to main: build the workbench, build the wheel, tag the version,
# and create the GitHub release with generated notes and the wheel attached.
# desktop/scripts/release.sh then builds the desktop app and uploads it into that same
# release, so the engine and the app always ship together under one version.
# The release date is the license record: FSL-1.1-MIT converts a version to MIT two years on.

on:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the release
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Read the version
        id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Skip everything if this version is already tagged
        id: tagged
        run: |
          if git ls-remote --exit-code --tags origin "v${{ steps.version.outputs.version }}" >/dev/null; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      # The app bundles the wheel and the wheel carries the workbench bundle, so this
      # build has to run before uv build reads src/nurb/workbench.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build --workspace packages/workbench

      # Until that bundle is in the package, the release would carry an engine with no
      # UI, and tagging would burn the version number for good.
      - name: Require the workbench bundle before releasing
        id: bundle
        run: |
          if [ -f src/nurb/workbench/index.html ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "no src/nurb/workbench/index.html yet, skipping the tag and the release"
          fi

      # The wheel is a release asset: the desktop build bundles it into the app.
      - name: Build the wheel
        if: steps.tagged.outputs.done != 'true' && steps.bundle.outputs.ready == 'true'
        run: uv build

      - name: Create the release
        if: steps.tagged.outputs.done != 'true' && steps.bundle.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            dist/*.whl
